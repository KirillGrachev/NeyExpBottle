# Experience is counted in LEVELS. "Exchange 5 levels" takes 5 levels from the
# player and keeps the fractional bar progress (12.4 - 5 = 7.4).
#
# PLACEHOLDERS - work in every text of this file and in menus/*.yml.
# They are listed here once on purpose: do not repeat them next to messages.
#
#   Player and experience
#     {player}            player name
#     {player_level}      current level
#     {player_exp}        total experience points
#     {player_progress}   experience bar fill, percent
#     {player_levels}     exact levels with fraction (12.4)
#
#   Deal and bottle
#     {levels}            levels in the deal and inside the bottle
#     {exp}               experience equivalent of {levels}
#     {required_exp}      same as {exp}, for price texts
#     {used_bottles}      empty bottles spent by the exchange
#     {max_levels}        level cap inside one bottle (settings.bottle.max_levels)
#     {tier}              exchange button id (tier_5); wrong argument in invalid_tier
#     {amount}            bottles created by an exchange or /neyexpbottle give
#
#   Amount selection (settings.amount)
#     {amount_selected}   raw selected amount, ready for [exchange]: 1, 16, all
#     {amount_label}      label of the selected amount (all_label for all)
#     {all_label}         label of the all option (settings.amount.all_label)
#     {amount_hint}       right-click hint from settings.amount.hint
#
#   Menus
#     {menu}              menu name
#     {available}         settings.menu.available_text, unavailable_text
#                         or unavailable_bottles_text (by refusal reason)
#     {cooldown}          cooldown left, seconds
#
#   Service (info, reload, help)
#     {tiers}             exchange tiers loaded
#     {time}              reload time, ms
#     {version}           plugin version
#     {author}            author from plugin.yml
#     {server}            core version
#     {created} {used} {denied} {suspicious} {menus_opened}   session counters
#
#   With PlaceholderAPI installed, %its_placeholders% work in the same texts.

settings:

  enabled: true # Global plugin switch
  debug: false # Debug messages to the console

  menu:
    default: exchange # Menu opened by /exp without arguments (file menus/<name>.yml)
    available_text: " &a✔ &fAvailable" # Substituted into {available}; leading space aligns it with the lore
    unavailable_text: " &c✖ &fNot enough levels" # Shown when levels are short; also the fallback for other refusals
    unavailable_bottles_text: " &c✖ &fNot enough empty bottles" # Shown when empty bottles are short

  permissions:
    enabled: true # Enable the permission system
    op_bypass: false # OP players and console ignore permission checks
    use: "expbottle.use" # Using bottles and the /exp command
    exchange: "expbottle.exchange" # Exchanging experience
    admin: "expbottle.admin" # /neyexpbottle reload|give|info|menu
    bypass_cooldown: "expbottle.bypass.cooldown" # Skip the exchange cooldown

  bottle:
    material: EXPERIENCE_BOTTLE
    glow: true # Enchantment glint without a visible enchantment
    max_levels: 1000 # Level cap inside one bottle (protects against edited NBT)
    safe_mode: false # Right click uses the bottle at once: the levels arrive immediately, no projectile,
                     # no orbs; false keeps the vanilla throw with the break reward
    pickup_radius: 4.0 # How close a player must stand to receive the levels on break
    break_sound:
      enabled: true
      name: ENTITY_EXPERIENCE_ORB_PICKUP
      volume: 1.0
      pitch: 1.0
    name: "<gradient:#5AFB08:#A4FDB1>Experience bottle</gradient> &8» &f{levels} LVL"
    lore:
      - " &fLevels inside: &e{levels}"
      - " &fExperience inside: &e{exp}"
    instruction:
      enabled: true # Append the usage hint to the end of the lore
      text: "&fRMB: &7throw to release"

  exchange:
    require_empty_bottles: true # Require an empty bottle for the exchange
    empty_bottle_material: GLASS_BOTTLE
    sound:
      enabled: true
      name: ENTITY_EXPERIENCE_ORB_PICKUP
      volume: 1.0
      pitch: 1.4
    fail_sound:
      enabled: true
      name: ENTITY_VILLAGER_NO
      volume: 1.0
      pitch: 1.0
    cooldown:
      enabled: false # Protection against clicking the menu faster than the server
      millis: 500

  amount:
    amounts: ["1", "16", "64", "all"] # Amount options; all - as many bottles as the player can afford
    all_label: "ALL" # Label of the all option in the switcher and hints
    switcher: # Lines drawn in place of {amount_options} on exchange buttons
      active: " &a» &f{label} &7bottle(s) &8(&e{cost} &7lvl&8)"
      inactive: " &7» {label} &7bottle(s) &8(&e{cost} &7lvl&8)"
    hint: "&eRMB: &7switch the amount &8(&f{amount_label}&8)"
    cycle_on_right_click: true # RMB on an exchange button cycles the amount; false makes RMB a plain
                             # click and hides the standalone {amount_options} / {amount_hint} lore lines
                             # (per-menu override: cycle_amount in the menu file)
    cycle_sound:
      enabled: true
      name: UI_BUTTON_CLICK
      volume: 0.5
      pitch: 1.4

