# Experience is counted in LEVELS. "Exchange 5 levels" takes 5 levels from the
# player and keeps the fractional bar progress (12.4 - 5 = 7.4).
#
# PLACEHOLDERS - work in every text of this file and in menus/*.yml.
#
#   Player and experience
#     {player}            player name
#     {player_level}      current level
#     {player_exp}        total experience points
#     {player_progress}   experience bar fill, percent
#     {player_levels}     exact levels with fraction (12.4)
#
#   Deal and bottle
#     {levels}            levels in the deal and inside the bottle
#     {exp}               experience equivalent of {levels}
#     {required_exp}      same as {exp}, for price texts
#     {used_bottles}      empty bottles spent by the exchange
#     {max_levels}        level cap inside one bottle (settings.bottle.max_levels)
#     {tier}              exchange button id (tier_5); wrong argument in invalid_tier
#     {amount}            bottles given by /neyexpbottle give
#
#   Menus
#     {menu}              menu name
#     {available}         settings.menu.available_text or unavailable_text
#     {cooldown}          cooldown left, seconds
#
#   Service (info, reload, help)
#     {tiers}             exchange buttons loaded
#     {time}              reload time, ms
#     {version}           plugin version
#     {author}            author from plugin.yml
#     {server}            core version
#     {created} {used} {denied} {suspicious} {menus_opened}   session counters
#
#   With PlaceholderAPI installed, %its_placeholders% work in the same texts.

settings:

  enabled: true # Global plugin switch
  debug: false # Debug messages to the console

  menu:
    default: exchange # Menu opened by /exp without arguments (file menus/<name>.yml)
    available_text: "&a✔ &fAvailable" # Substituted into {available}
    unavailable_text: "&c✖ &fNot enough levels"

  permissions:
    enabled: true # Enable the permission system
    op_bypass: false # OP players and console ignore permission checks
    use: "expbottle.use" # Using bottles and the /exp command
    exchange: "expbottle.exchange" # Exchanging experience
    admin: "expbottle.admin" # /neyexpbottle reload|give|info|menu
    bypass_cooldown: "expbottle.bypass.cooldown" # Skip the exchange cooldown

  bottle:
    material: EXPERIENCE_BOTTLE
    glow: true # Enchantment glint without a visible enchantment
    max_levels: 1000 # Level cap inside one bottle (protects against edited NBT)
    throwable: true # Right click throws the bottle like a vanilla experience bottle
    release_on_break: true # A broken bottle grants its levels to a nearby player
    pickup_radius: 4.0 # How close a player must stand to receive the levels on break
    break_sound:
      enabled: true
      name: ENTITY_EXPERIENCE_ORB_PICKUP
      volume: 1.0
      pitch: 1.0
    name: "<gradient:#5AFB08:#A4FDB1>Experience Bottle</gradient> &8» &f{levels} LVL"
    lore:
      - " &7▪ &fLevels inside: &e{levels}"
      - " &7▪ &fExperience inside: &e{exp}"
    instruction:
      enabled: true # Append the usage hint to the end of the lore
      text: " #FFD700➤ &fRMB: &7throw to release"

  exchange:
    require_empty_bottles: true # Require an empty bottle for the exchange
    empty_bottle_material: GLASS_BOTTLE
    sound:
      enabled: true
      name: ENTITY_EXPERIENCE_ORB_PICKUP
      volume: 1.0
      pitch: 1.4
    fail_sound:
      enabled: true
      name: ENTITY_VILLAGER_NO
      volume: 1.0
      pitch: 1.0
    cooldown:
      enabled: false # Protection against clicking the menu faster than the server
      millis: 500


messages:

  only_players:
    enabled: true
    text:
      - " #efff5e[⚠] #ecff45This command is only available to players."

  no_permission:
    enabled: true
    text:
      - " #efff5e[⚠] #ecff45You don't have permission for this."

  plugin_disabled:
    enabled: true
    text:
      - " #efff5e[⚠] #ecff45The experience exchange is currently disabled."

  # {menu}
  menu_not_found:
    enabled: true
    text:
      - " #FF6B6B[✖] &fMenu &e{menu} &fwas not found in the menus folder."

  menu_denied:
    enabled: true
    text:
      - " #FF6B6B[✖] &fThis menu is not available right now."

  menu_usage:
    enabled: true
    text:
      - " #efff5e[⚠] #ecff45Usage: &f/neyexpbottle menu <name> [player]"

  exchange_usage:
    enabled: true
    text:
      - " #efff5e[⚠] #ecff45Usage: &f/exp exchange <levels|id>"

  not_enough_levels:
    enabled: true
    text:
      - ""
      - " #FF6B6B[✖] &fYou don't have &e{levels} &flevels to exchange."
      - " &7You currently have &f{player_levels} &7levels."
      - ""

  not_enough_bottles:
    enabled: true
    text:
      - ""
      - " #FF6B6B[✖] &fYou need an empty bottle &7(&fGLASS_BOTTLE&7)&f."
      - ""

  # {cooldown} - seconds left
  on_cooldown:
    enabled: true
    text:
      - " #efff5e[⌛] #ecff45Wait &e{cooldown} &7more seconds."

  exchange_cancelled:
    enabled: false # Another plugin cancelled the exchange (silent by default)
    text:
      - " #efff5e[⚠] #ecff45The exchange was cancelled."

  # {levels} {exp} {used_bottles} {player_level} {player_exp}
  bottle_created:
    enabled: true
    text:
      - ""
      - " #4ECDC4[✔] &fYou exchanged &e{levels} &flevels for an experience bottle."
      - " &7Left: &f{player_levels} &7levels &8(&f{player_exp} &7exp&8)"
      - ""

  bottle_broken:
    enabled: true
    text:
      - " #FF6B6B[✖] &fThis experience bottle is damaged."

  bottle_forged:
    enabled: true
    text:
      - " #FF6B6B[✖] &fThis bottle was not created by the server and is rejected."

  reload_start:
    enabled: true
    text:
      - " #efff5e[↻] #ecff45Reloading configuration..."

  # {tiers}
  reload_success:
    enabled: true
    text:
      - " #4ECDC4[✔] &fConfiguration reloaded."
      - " &7Exchange tiers: &e{tiers}"

  # {time}
  reload_time:
    enabled: true
    text:
      - " &7Took: &e{time} &7ms"

  reload_error:
    enabled: true
    text:
      - " #FF6B6B[✖] &fFailed to reload the configuration, see the console."

  # {player} {levels} {amount}
  give_success:
    enabled: true
    text:
      - " #4ECDC4[✔] &fGiven &e{amount}x &fbottles with &e{levels} &flevels to &e{player}&f."

  give_received:
    enabled: true
    text:
      - " #4ECDC4[✔] &fYou received &e{amount}x &fbottle(s) with &e{levels} &flevels."

  give_usage:
    enabled: true
    text:
      - " #efff5e[⚠] #ecff45Usage: &f/neyexpbottle give <player> <levels|id> [amount]"

  # {player}
  player_not_found:
    enabled: true
    text:
      - " #FF6B6B[✖] &fPlayer &e{player} &fis not online."

  # {tier}
  invalid_tier:
    enabled: true
    text:
      - " #FF6B6B[✖] &fExchange tier &e{tier} &fdoes not exist in menus/."

  # {levels} {max_levels}
  invalid_amount:
    enabled: true
    text:
      - " #FF6B6B[✖] &fInvalid value &e{levels}&7. Allowed: &f1 - {max_levels}&7."

  info:
    enabled: true
    text:
      - ""
      - "&#4ECDC4NeyExpBottle &#8ce0ff» &#4ECDC4diagnostics:"
      - "&fPlayer &8- &7{player}"
      - "&fLevel &8- &7{player_level} &8(&7{player_progress}%&8)"
      - "&fExperience &8- &7{player_exp}"
      - "&fExchange tiers &8- &7{tiers}"
      - "&fBottles created &8- &7{created}"
      - "&fBottles used &8- &7{used}"
      - "&fDenied exchanges &8- &7{denied}"
      - "&fSuspicious events &8- &7{suspicious}"
      - "&fPlugin version &8- &7{version} &8| &fCore &8- &7{server}"
      - ""

  help:
    enabled: true
    text:
      - ""
      - "&#4ECDC4NeyExpBottle &#8ce0ff» &#4ECDC4NeyExpBottle commands:"
      - "&f/exp &8- &7open the default exchange menu"
      - "&f/exp exchange <levels|id> &8- &7exchange levels for a bottle"
      - "&f/exp open <menu> &8- &7open a specific menu"
      - "&f/neyexpbottle reload &8- &7reload the configuration"
      - "&f/neyexpbottle give <player> <levels|id> [amount] &8- &7give a bottle"
      - "&f/neyexpbottle info [player] &8- &7diagnostics"
      - "&f/neyexpbottle menu <name> [player] &8- &7open any menu"
      - ""
